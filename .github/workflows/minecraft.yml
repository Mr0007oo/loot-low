name: Minecraft Server

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: minecraft-server-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      FRP_SERVER_IP: ${{ secrets.FRP_SERVER_IP }}
      FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python and bot dependencies
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Telegram and RCON packages
        run: |
          if [[ ! -x .venv/bin/python ]]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify runtime system tools
        run: |
          for tool in java git curl sed tar; do
            command -v "$tool" >/dev/null || { echo "Missing required system tool: $tool" >&2; exit 1; }
          done

      - name: Restore and save world and plugin data
        uses: actions/cache@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins
          key: minecraft-world-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: minecraft-world-

      - name: Download and validate Paper and plugins
        env:
          GEYSER_VERSION: ${{ vars.GEYSER_VERSION || '2.11.2' }}
          GEYSER_BUILD: ${{ vars.GEYSER_BUILD || '1235' }}
          GEYSER_BEDROCK_PROTOCOL: ${{ vars.GEYSER_BEDROCK_PROTOCOL || '26_20' }}
          FLOODGATE_VERSION: ${{ vars.FLOODGATE_VERSION || '2.2.5' }}
          FLOODGATE_BUILD: ${{ vars.FLOODGATE_BUILD || '141' }}
        run: python3 scripts/download_deps.py

      - name: Download and validate FRP client
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FRP_SERVER_IP" || -z "$FRP_TOKEN" ]]; then
            echo "ERROR: FRP_SERVER_IP and FRP_TOKEN secrets are required." >&2
            exit 1
          fi
          release_json=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://api.github.com/repos/fatedier/frp/releases/latest)
          archive_url=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((asset["browser_download_url"] for asset in data.get("assets", []) if asset.get("name", "").endswith("_linux_amd64.tar.gz")), ""))' <<<"$release_json")
          if [[ -z "$archive_url" ]]; then
            echo "ERROR: Could not find an FRP Linux amd64 release archive." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$archive_url" --output frpc-release.tar.gz
          tar -xzf frpc-release.tar.gz --wildcards '*/frpc'
          extracted_frpc=$(find . -mindepth 2 -maxdepth 3 -type f -name frpc -print -quit)
          if [[ -z "$extracted_frpc" ]]; then
            echo "ERROR: FRP release archive did not contain frpc." >&2
            exit 1
          fi
          mv "$extracted_frpc" ./frpc
          chmod +x ./frpc
          ./frpc verify -c frpc.toml

      - name: Send boot notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; skipping boot notification."
            exit 0
          fi
          curl --silent --show-error --fail --max-time 15 --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Booting Minecraft server for Mr0007oo/loot-low with Java 21." \
            >/dev/null || echo "WARNING: Telegram boot notification failed."

      - name: Start FRP and Paper
        id: run-server
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p server/logs
          server_log="server/logs/server-session.log"
          : >"$server_log"
          TELEGRAM_BOT_PID=""
          AUTO_SAVE_PID=""
          WATCHDOG_PID=""
          LOG_TAIL_PID=""
          tail -n 0 -F "$server_log" &
          LOG_TAIL_PID=$!

          notify() {
            local message="$1"
            if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
              curl --silent --show-error --fail --max-time 15 --request POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${message}" >/dev/null || echo "WARNING: Telegram notification failed."
            fi
          }

          cleanup() {
            trap - EXIT INT TERM
            if [[ -n "${TELEGRAM_BOT_PID:-}" ]] && kill -0 "$TELEGRAM_BOT_PID" 2>/dev/null; then
              kill -TERM "$TELEGRAM_BOT_PID" 2>/dev/null || true
              wait "$TELEGRAM_BOT_PID" 2>/dev/null || true
            fi
            if [[ -n "${AUTO_SAVE_PID:-}" ]] && kill -0 "$AUTO_SAVE_PID" 2>/dev/null; then
              kill -TERM "$AUTO_SAVE_PID" 2>/dev/null || true
              wait "$AUTO_SAVE_PID" 2>/dev/null || true
            fi
            if [[ -n "${WATCHDOG_PID:-}" ]] && kill -0 "$WATCHDOG_PID" 2>/dev/null; then
              kill -TERM "$WATCHDOG_PID" 2>/dev/null || true
              wait "$WATCHDOG_PID" 2>/dev/null || true
            fi
            if [[ -n "${LOG_TAIL_PID:-}" ]] && kill -0 "$LOG_TAIL_PID" 2>/dev/null; then
              kill -TERM "$LOG_TAIL_PID" 2>/dev/null || true
              wait "$LOG_TAIL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 143' INT TERM

          ./scripts/auto_save.sh >server/logs/auto-save-loop.log 2>&1 &
          AUTO_SAVE_PID=$!

          ./frpc -c frpc.toml >frpc.log 2>&1 &
          FRPC_PID=$!
          sleep 5
          if ! kill -0 "$FRPC_PID" 2>/dev/null; then
            cat frpc.log || true
            echo "ERROR: frpc exited during startup." >&2
            exit 1
          fi
          java_address="${FRP_SERVER_IP}:25565"
          bedrock_address="${FRP_SERVER_IP}:19132/UDP"
          voice_chat_address="${FRP_SERVER_IP}:24454/UDP"
          echo "FRP Java tunnel: ${java_address}"
          echo "FRP Bedrock tunnel: ${bedrock_address}"
          echo "FRP Simple Voice Chat tunnel: ${voice_chat_address}"
          notify "Minecraft Java TCP: ${java_address}; Bedrock UDP: ${bedrock_address}; Simple Voice Chat UDP: ${voice_chat_address}"
          export FRPC_PID FRPC_BIN="$PWD/frpc" FRPC_CONFIG="$PWD/frpc.toml" FRPC_LOG="$PWD/frpc.log"

          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
            .venv/bin/python scripts/telegram_bot.py >server/logs/telegram-bot.log 2>&1 &
            TELEGRAM_BOT_PID=$!
          else
            echo "WARNING: Telegram bot secrets are not configured; RCON bot will not start."
          fi

          ./server/watchdog.sh >server/logs/watchdog.log 2>&1 &
          WATCHDOG_PID=$!

          ready=false
          for ((second = 0; second < 180; second++)); do
            if grep -Fq 'Done (' "$server_log"; then
              ready=true
              break
            fi
            if grep -Fq 'ERROR:' server/logs/watchdog.log 2>/dev/null; then
              cat server/logs/watchdog.log frpc.log 2>/dev/null || true
              exit 1
            fi
            if ! kill -0 "$WATCHDOG_PID" 2>/dev/null; then
              if wait "$WATCHDOG_PID"; then
                server_status=0
              else
                server_status=$?
              fi
              tail -n 30 "$server_log" || true
              cat frpc.log server/logs/watchdog.log 2>/dev/null || true
              exit "${server_status:-1}"
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            tail -n 30 "$server_log" || true
            cat server/logs/watchdog.log frpc.log 2>/dev/null || true
            notify "Minecraft startup timed out before Paper reported ready. Check the Actions log."
            exit 1
          fi

          PYTHONPATH=scripts .venv/bin/python -c 'from rcon_utils import rcon_command; print("RCON ready: " + rcon_command("list"))'
          for plugin in ViaVersion ViaBackwards ViaRewind Geyser-Spigot floodgate voicechat Essentials LuckPerms; do
            if ! grep -Fq "Enabling ${plugin} v" "$server_log"; then
              echo "ERROR: ${plugin} did not report successful plugin enablement." >&2
              tail -n 80 "$server_log"
              exit 1
            fi
          done
          PYTHONPATH=scripts .venv/bin/python - <<'PY'
          from rcon_utils import rcon_command

          for permission in ("essentials.tpa", "essentials.tpaccept", "essentials.tpdeny"):
              result = rcon_command(f"lp group default permission set {permission} true")
              print(f"LuckPerms default grant {permission}: {result}")
          PY
          echo "Required plugins enabled: ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot, floodgate, voicechat, Essentials, LuckPerms."
          if [[ -n "$TELEGRAM_BOT_PID" ]]; then
            if ! kill -0 "$TELEGRAM_BOT_PID" 2>/dev/null; then
              cat server/logs/telegram-bot.log || true
              echo "ERROR: Telegram bot exited during startup." >&2
              exit 1
            fi
            cat server/logs/telegram-bot.log
          fi
          if [[ -n "$AUTO_SAVE_PID" ]] && ! kill -0 "$AUTO_SAVE_PID" 2>/dev/null; then
            cat server/logs/auto-save-loop.log || true
            echo "ERROR: World auto-save loop exited during startup." >&2
            exit 1
          fi
          cat server/logs/auto-save-loop.log || true

          ready_log=$(tail -n 8 "$server_log" | sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' | cut -c1-300 | tr -d '\r')
          notify "Minecraft is READY on Mr0007oo/loot-low.\n\n${ready_log}"

          if wait "$WATCHDOG_PID"; then
            server_status=0
          else
            server_status=$?
          fi
          exit "$server_status"

      - name: Send shutdown and world-save notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVER_STEP_OUTCOME: ${{ steps.run-server.outcome }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; skipping shutdown notification."
            exit 0
          fi
          message="Minecraft workflow ended. Server step: ${SERVER_STEP_OUTCOME}. World and player data are pushed to Git when changed."
          curl --silent --show-error --fail --max-time 15 --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            >/dev/null || echo "WARNING: Telegram shutdown notification failed."