name: Native Bedrock Server

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: minecraft-server-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      FRP_SERVER_IP: ${{ secrets.FRP_SERVER_IP }}
      FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
      WORLD_RECOVERY_COMMIT: ${{ vars.WORLD_RECOVERY_COMMIT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate native server code and configuration
        run: |
          python3 -m compileall -q scripts tests server/plugins/server_utils/src server/plugins/fun_plugins/src server/plugins/vein_miner/src server/plugins/container_plugins/src server/plugins/pvp_duels/src server/plugins/land_claims/src server/plugins/world_edit/src
          python3 -m unittest discover -s tests -v
          bash -n server/start.sh server/watchdog.sh
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/server_utils
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/fun_plugins
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/vein_miner
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/container_plugins
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/pvp_duels
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/land_claims
          python3 -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP" server/plugins/world_edit
          python3 -m json.tool server/permissions.json >/dev/null
          python3 -m json.tool server/allowlist.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path

          properties = {}
          for line in Path("server/server.properties").read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  properties[key.strip()] = value.strip()
          expected = {
              "server-port": "19132",
              "server-ip": "0.0.0.0",
              "difficulty": "normal",
              "allow-outdated-client": "true",
              "emit-server-telemetry": "false",
          }
          mismatches = {
              key: (properties.get(key), value)
              for key, value in expected.items()
              if properties.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"Invalid Bedrock network settings (actual, expected): {mismatches}")
          PY

      - name: Cache Bedrock world and player data
        uses: actions/cache@v4
        with:
          path: |
            server/bedrock_server/worlds
            server/permissions.json
            server/allowlist.json
          key: bedrock-world-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bedrock-world-

      - name: Download and validate Endstone
        env:
          ENDSTONE_VERSION: 0.11.2
          BEDROCK_CLIENT_VERSION: 1.26.2
        run: python3 scripts/download_deps.py

      - name: Verify pinned Bedrock runtime before startup
        run: python3 scripts/download_deps.py --check

      - name: Restore missing legacy world directories
        if: ${{ vars.WORLD_RECOVERY_COMMIT != '' }}
        run: python3 scripts/persist_world.py --restore-only "$WORLD_RECOVERY_COMMIT"

      - name: Assert native-only server artifacts
        run: |
          if find server -type f -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: Java archive found after native dependency setup." >&2
            exit 1
          fi

      - name: Download and validate FRP client
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FRP_SERVER_IP" || -z "$FRP_TOKEN" ]]; then
            echo "ERROR: FRP_SERVER_IP and FRP_TOKEN secrets are required." >&2
            exit 1
          fi
          release_json=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://api.github.com/repos/fatedier/frp/releases/latest)
          archive_url=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((asset["browser_download_url"] for asset in data.get("assets", []) if asset.get("name", "").endswith("_linux_amd64.tar.gz")), ""))' <<<"$release_json")
          if [[ -z "$archive_url" ]]; then
            echo "ERROR: Could not find an FRP Linux amd64 release archive." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$archive_url" --output frpc-release.tar.gz
          tar -xzf frpc-release.tar.gz --wildcards '*/frpc'
          extracted_frpc=$(find . -mindepth 2 -maxdepth 3 -type f -name frpc -print -quit)
          if [[ -z "$extracted_frpc" ]]; then
            echo "ERROR: FRP release archive did not contain frpc." >&2
            exit 1
          fi
          mv "$extracted_frpc" ./frpc
          chmod +x ./frpc
          ./frpc verify -c frpc.toml

      - name: Start FRP and native Bedrock server
        id: run-server
        timeout-minutes: 330
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required." >&2
            exit 1
          fi
          mkdir -p server/logs
          server_log="server/logs/server-session.log"
          watchdog_log="server/logs/watchdog.log"
          telegram_log="server/logs/telegram-console.log"
          console_fifo="$RUNNER_TEMP/loot-low-console.fifo"
          stop_request="$RUNNER_TEMP/loot-low-stop.request"
          rm -f -- "$console_fifo" "$stop_request"
          export SERVER_CONSOLE_FIFO="$console_fifo"
          export SERVER_STOP_FILE="$stop_request"
          : >"$server_log"
          : >"$watchdog_log"
          : >"$telegram_log"
          tail -n 0 -F "$server_log" "$watchdog_log" "$telegram_log" &
          LOG_TAIL_PID=$!

          cleanup() {
            local exit_status=$?
            trap - EXIT INT TERM
            if [[ -n "${TELEGRAM_PID:-}" ]] && kill -0 "$TELEGRAM_PID" 2>/dev/null; then
              kill -TERM "$TELEGRAM_PID" 2>/dev/null || true
              wait "$TELEGRAM_PID" 2>/dev/null || true
            fi
            if [[ -n "${WATCHDOG_PID:-}" ]] && kill -0 "$WATCHDOG_PID" 2>/dev/null; then
              kill -TERM "$WATCHDOG_PID" 2>/dev/null || true
              wait "$WATCHDOG_PID" 2>/dev/null || true
            fi
            if [[ -n "${FRPC_PID:-}" ]] && kill -0 "$FRPC_PID" 2>/dev/null; then
              kill -TERM "$FRPC_PID" 2>/dev/null || true
              wait "$FRPC_PID" 2>/dev/null || true
            fi
            if [[ -n "${LOG_TAIL_PID:-}" ]] && kill -0 "$LOG_TAIL_PID" 2>/dev/null; then
              kill -TERM "$LOG_TAIL_PID" 2>/dev/null || true
              wait "$LOG_TAIL_PID" 2>/dev/null || true
            fi
            rm -f -- "$console_fifo" "$stop_request"
            if ! python3 scripts/persist_world.py; then
              echo "ERROR: World persistence failed during workflow shutdown." >&2
              if [[ "$exit_status" -eq 0 ]]; then
                exit_status=1
              fi
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT
          trap 'exit 143' INT TERM

          ./frpc -c frpc.toml >frpc.log 2>&1 &
          FRPC_PID=$!
          sleep 5
          if ! kill -0 "$FRPC_PID" 2>/dev/null; then
            cat frpc.log || true
            echo "ERROR: frpc exited during startup." >&2
            exit 1
          fi
          echo "Native Minecraft Bedrock UDP endpoint: ${FRP_SERVER_IP}:19132"
          export FRPC_PID FRPC_BIN="$PWD/frpc" FRPC_CONFIG="$PWD/frpc.toml" FRPC_LOG="$PWD/frpc.log"
          export SERVER_LOG="$PWD/$server_log"
          ./server/watchdog.sh >"$watchdog_log" 2>&1 &
          WATCHDOG_PID=$!

          ready=false
          for ((second = 0; second < 240; second++)); do
            if grep -Fq 'Server started.' "$server_log" \
              && grep -Fq 'Server utilities enabled.' "$server_log" \
              && grep -Fq 'Fun command utilities enabled.' "$server_log" \
              && grep -Fq 'Vein Miner enabled (32-block limit).' "$server_log" \
              && grep -Fq 'Container commands enabled.' "$server_log" \
              && grep -Fq 'PvP Duels enabled' "$server_log" \
              && grep -Fq 'Land Claims enabled' "$server_log" \
              && grep -Fq 'World Edit enabled (512-block fill limit).' "$server_log"; then
              ready=true
              break
            fi
            if grep -Fq 'ERROR:' "$watchdog_log" 2>/dev/null; then
              cat "$watchdog_log" frpc.log 2>/dev/null || true
              exit 1
            fi
            if ! kill -0 "$WATCHDOG_PID" 2>/dev/null; then
              if wait "$WATCHDOG_PID"; then
                server_status=0
              else
                server_status=$?
              fi
              tail -n 80 "$server_log" || true
              cat frpc.log "$watchdog_log" 2>/dev/null || true
              exit "${server_status:-1}"
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            tail -n 80 "$server_log" || true
            cat "$watchdog_log" frpc.log 2>/dev/null || true
            echo "ERROR: Endstone did not report server readiness within 240 seconds." >&2
            exit 1
          fi
          echo "Native Bedrock server is ready at ${FRP_SERVER_IP}:19132/UDP."

          python3 scripts/telegram_console.py >>"$telegram_log" 2>&1 &
          TELEGRAM_PID=$!
          echo "Telegram admin console is active. Use /cmd <command> or /stop."

          while true; do
            if [[ -f "$stop_request" ]]; then
              echo "Telegram admin requested graceful server shutdown."
              kill -TERM "$WATCHDOG_PID" 2>/dev/null || true
              if wait "$WATCHDOG_PID"; then
                server_status=0
              else
                server_status=$?
              fi
              WATCHDOG_PID=""
              if [[ "$server_status" -ne 0 && "$server_status" -ne 143 ]]; then
                exit "$server_status"
              fi
              exit 0
            fi

            if ! kill -0 "$TELEGRAM_PID" 2>/dev/null; then
              if wait "$TELEGRAM_PID"; then
                telegram_status=0
              else
                telegram_status=$?
              fi
              cat "$telegram_log" || true
              echo "ERROR: Telegram console exited with status ${telegram_status}." >&2
              exit "${telegram_status:-1}"
            fi

            if ! kill -0 "$WATCHDOG_PID" 2>/dev/null; then
              if wait "$WATCHDOG_PID"; then
                server_status=0
              else
                server_status=$?
              fi
              exit "${server_status:-1}"
            fi
            sleep 1
          done

      - name: Persist world data to main
        if: ${{ always() }}
        timeout-minutes: 10
        run: python3 scripts/persist_world.py
