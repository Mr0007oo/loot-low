[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-land-claims"
version = "1.0.0"
description = "Lightweight chunk claims and block protection for Endstone"
requires-python = ">=3.10"
dependencies = ["endstone==0.11.2"]

[project.entry-points."endstone"]
land-claims = "land_claims:LandClaimsPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
