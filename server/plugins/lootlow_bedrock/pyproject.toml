[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lootlow-bedrock"
version = "1.0.0"
description = "Native Bedrock utility and protection features for Endstone"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
lootlow-bedrock = "lootlow_bedrock:LootLowPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
