[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-server-utils"
version = "1.0.0"
description = "Lightweight server information command for Endstone"
requires-python = ">=3.10"
dependencies = ["endstone==0.11.2"]

[project.entry-points."endstone"]
server-utils = "server_utils:ServerUtilsPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
