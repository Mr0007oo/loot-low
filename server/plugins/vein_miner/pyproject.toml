[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-vein-miner"
version = "1.0.0"
description = "Bounded vein mining for Endstone"
requires-python = ">=3.10"
dependencies = ["endstone==0.11.2"]

[project.entry-points."endstone"]
vein-miner = "vein_miner:VeinMinerPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
